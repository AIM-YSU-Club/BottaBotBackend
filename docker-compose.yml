services:
    backend:
        # 현재 디렉토리(.)에 있는 방금 만든 Spring Boot Dockerfile을 사용해 빌드
        build: .
        container_name: bottabot_backend
        env_file: .env
        environment:
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_URL=${REDIS_URL}

        # 호스트 8000 : 컨테이너 8000 (스프링 부트 기본 포트)
        ports:
            - "${PORT}:8080"

        # (주의) 로컬 코드를 덮어씌우는 파이썬식 볼륨 바인딩은 컴파일 언어인 자바와 충돌하므로 제거했습니다.
        restart: always

    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: bottabot_cloudflared
        command: tunnel --no-autoupdate --url http://127.0.0.1:${PORT}
        network_mode: host
        restart: unless-stopped

    # Temporary one-shot: read Quick Tunnel URL from cloudflared logs → Discord webhook
    tunnel-notify:
        image: docker:cli
        container_name: bottabot_tunnel_notify
        depends_on:
            - cloudflared
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./scripts/notify-quick-tunnel.sh:/notify-quick-tunnel.sh:ro
        environment:
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
            - CLOUDFLARED_CONTAINER=bottabot_cloudflared
            - NOTIFY_MAX_WAIT_SEC=${NOTIFY_MAX_WAIT_SEC:-90}
        entrypoint: ["/bin/sh", "/notify-quick-tunnel.sh"]
        restart: "no"
